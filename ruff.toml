# The lint rules follow the Python sibling repositories' [tool.ruff] sections;
# only the per-file ignores for tests differ.
target-version = "py311"
line-length = 100

[lint]
select = [
    "A",      # flake8-builtins
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "ERA",    # eradicate
    "F",      # pyflakes
    "I",      # isort (import order)
    "N",      # pep8-naming
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade (includes f-string)
    "W",      # pycodestyle warnings
]
ignore = [
    "PT018",  # Allow composite assertions for better readability
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "PT009",  # Tests use unittest so that they need only the standard library, like the hook
    "S603",   # Tests run the scripts under test with fixed arguments
    "S607",   # Tests find git and bash on PATH, as the scripts under test do
]
